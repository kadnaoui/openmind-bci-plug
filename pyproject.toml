[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openmind-plug"
version = "0.1.0.dev0"
description = "Universal EEG plug: read any headset, a replayed dataset or a synthetic signal, and stream it as standard LSL."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenMind BCI contributors" }]
requires-python = ">=3.11"
keywords = ["eeg", "bci", "brain-computer-interface", "lsl", "labstreaminglayer", "neuroscience"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pylsl>=1.16.2",
    "mne>=1.7",
    "pydantic>=2.6",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.optional-dependencies]
replay = ["moabb>=1.1"]
brainflow = ["brainflow>=5.12"]
ironbci = ["bleak>=0.22"]

[project.scripts]
openmind-plug = "openmind_plug.cli:app"

[project.urls]
Homepage = "https://github.com/openmind-bci/plug"
Repository = "https://github.com/openmind-bci/plug"
Issues = "https://github.com/openmind-bci/plug/issues"
Changelog = "https://github.com/openmind-bci/plug/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openmind_plug"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CHANGELOG.md"]

# --- Lint & format ---------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "NPY",     # numpy-specific rules
    "RUF",     # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["openmind_plug"]

# --- Typing ----------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "examples"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pylsl.*", "mne.*", "moabb.*", "brainflow.*", "bleak.*", "scipy.*"]
ignore_missing_imports = true

# --- Tests -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: long-running or network-dependent tests (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["openmind_plug"]
branch = true
